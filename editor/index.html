<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spot A Fish Editor</title>
<style>
:root{--bg:#12161c;--pn:#1a2029;--pn2:#212836;--bd:#2d3646;--tx:#e8ebf0;--mu:#8d97a8;--ac:#f28a1f;--acx:#1a1205;--wr:#e0b341;--wrbg:#2b2410;--wrbd:#6b5a1e;--ok:#4cc38a;--er:#ef6a6a}
:root[data-theme=light]{--bg:#f3f4f7;--pn:#ffffff;--pn2:#eceef3;--bd:#d6dbe4;--tx:#1b2330;--mu:#6a7587;--ac:#e07a10;--acx:#ffffff;--wr:#8a6410;--wrbg:#fff4d6;--wrbd:#e6c35c;--ok:#1d8a57;--er:#c23b3b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--pn2);border:1px solid var(--bd);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--mu)}button.pr{background:var(--ac);border-color:var(--ac);color:var(--acx)}button:disabled{opacity:.45;cursor:default}
button.dirty{outline:2px solid var(--ac)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 6px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex:none;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.12em;color:var(--ac)}
:root[data-theme=light] .logo{color:#111}
.tab{padding:5px 12px;border-radius:6px;color:var(--mu);cursor:pointer;border:0;background:none}.tab.on{background:var(--pn2);color:var(--tx)}
.grow{flex:1}.mu{color:var(--mu)}.sm{font-size:11px}
main{flex:1;display:grid;grid-template-columns:var(--lw,200px) 6px minmax(0,1fr) 6px var(--rw,260px);min-height:0}
main.org{grid-template-columns:var(--lw,200px) 6px minmax(0,1fr) 6px var(--rw,260px)}
.col{overflow:auto;padding:10px;min-width:0}
.col.collapsed{padding:0;overflow:hidden;width:0}
.split{background:var(--bd);cursor:col-resize}.split:hover{background:var(--ac)}
h3{margin:0 0 6px;font-size:11px;font-weight:500;color:var(--mu);display:flex;align-items:center;justify-content:space-between}
.sec{margin-bottom:14px}.sec>h3.t{color:var(--tx);font-size:12px}
.row{padding:6px 8px;border-radius:6px;margin-bottom:3px;cursor:pointer;border:1px solid transparent}.row:hover{background:var(--pn2)}.row.on{background:var(--pn2);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.f{display:block;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:4px 7px}.f small{display:block;color:var(--mu);font-size:10px}
.f input,.f select{border:0;background:transparent;padding:1px 0}
.f.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}.f.pair small{grid-column:1/3}
.warn{background:var(--wrbg);border:1px solid var(--wrbd);color:var(--wr);border-radius:6px;padding:5px 8px;margin-bottom:4px}
.ok{color:var(--ok)}.bad{color:var(--er)}
.tbd{border:1px dashed var(--bd);border-radius:6px;padding:7px 8px;color:var(--mu)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.status{flex:none;padding:5px 12px;border-top:1px solid var(--bd);color:var(--mu);background:var(--pn)}
#cv{width:100%;height:300px;border:1px solid var(--bd);border-radius:8px;background:var(--pn);display:block;touch-action:none;cursor:grab}
.lv{display:flex;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin-bottom:4px}
.lv.drag{opacity:.4}.hnd{cursor:grab;color:var(--mu)}
.over{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:center;justify-content:center;z-index:50}.over.show{display:flex}
.modal{width:min(480px,92vw);max-height:86vh;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px}
.modal .r{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--bd)}
#play{position:fixed;inset:0;background:#0b0e13;z-index:60;display:none;flex-direction:column}#play.show{display:flex}
#play .pb{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
#play iframe{flex:1;border:0;width:100%;background:#0b0e13}
#play .seed{width:120px}
.hide{display:none!important}
details>summary{cursor:pointer;color:var(--mu);margin-bottom:6px}
</style>
</head>
<body>
<header>
  <span class="logo" title="Athena logo placeholder: replace with the official asset">ATHENA</span><span class="mu">Spot A Fish Editor</span>
  <button class="tab on" id="tEd">Editor</button><button class="tab" id="tOrg">Organiser</button>
  <span class="grow mu sm" id="store" style="text-align:right"></span>
  <button id="bUndo" title="Undo">Undo</button><button id="bRedo" title="Redo">Redo</button><button id="bSave" class="pr">Save</button><button id="bTheme">Theme</button><button id="bPlay" class="pr">Play</button>
</header>
<main id="main">
  <section class="col" id="cL"></section><div class="split" id="sL" title="Drag to resize, double-click to reset"></div>
  <section class="col" id="cC"></section><div class="split" id="sR" title="Drag to resize, double-click to reset"></div>
  <section class="col" id="cR"></section>
</main>
<div class="status" id="status">Ready</div>
<div class="over" id="ovAdd"><div class="modal" id="mAdd"></div></div>
<div id="play"><div class="pb"><button id="pBack">Back to editor</button><button id="pRestart">Restart</button><label class="mu sm">Seed (empty = random) <input class="seed" id="pSeed" type="text"></label><span class="mu sm" id="pInfo"></span></div><iframe id="pFrame" title="Play test"></iframe></div>
